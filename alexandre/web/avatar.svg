<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Alexandre, le croissant du fournil">
  <!--
    Avatar provisoire d'Alexandre : un croissant humanoïde.
    Pour le remplacer par le logo définitif, remplacer ce fichier seul.
    Les humeurs (au repos, pétrit, prêt) sont animées par web/app.css
    via ces classes ; un logo qui ne les reprend pas reste affiché,
    seule la respiration de l'ensemble s'applique alors.
      .lueur   anneau doré (allumé quand Alexandre pétrit)
      .vapeur  filets de vapeur (montent quand Alexandre pétrit)
      .yeux    clignent au repos, plissés quand il pétrit
      .badge   coche verte (apparaît quand la réponse est prête)
  -->
  <circle cx="24" cy="24" r="24" fill="#2B1D14"/>
  <circle class="lueur" cx="24" cy="24" r="22" fill="none" stroke="#E9B44C" stroke-width="2"/>
  <g class="vapeur" fill="none" stroke="#FBF6EC" stroke-width="1.5" stroke-linecap="round">
    <path d="M18 10c-1.6-1.6 1.6-2.6 0-4.2"/>
    <path d="M24 9c-1.6-1.6 1.6-2.8 0-4.6"/>
    <path d="M30 10c-1.6-1.6 1.6-2.6 0-4.2"/>
  </g>
  <g class="bras" stroke="#E9B44C" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M10.5 25.5 7 21.5"/>
    <path d="M37.5 25.5 41 21.5"/>
  </g>
  <path d="M6 31C7 19 15 12 24 12s17 7 18 19c-2 3-6 2-7.5-.5C32 25 28.5 22.5 24 22.5S16 25 13.5 30.5C12 33 8 34 6 31Z" fill="#E9B44C"/>
  <path d="M15.5 18l3 6.5M32.5 18l-3 6.5M9.5 24.5l3.6 3.5M38.5 24.5 34.9 28" stroke="#A4561A" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.7"/>
  <circle cx="19.6" cy="19" r="1.2" fill="#A4561A" opacity="0.35"/>
  <circle cx="28.4" cy="19" r="1.2" fill="#A4561A" opacity="0.35"/>
  <g class="yeux" fill="#2B1D14">
    <ellipse cx="21" cy="16.4" rx="1.15" ry="1.35"/>
    <ellipse cx="27" cy="16.4" rx="1.15" ry="1.35"/>
  </g>
  <path d="M22.2 19.2q1.8 1.6 3.6 0" fill="none" stroke="#2B1D14" stroke-width="1.1" stroke-linecap="round"/>
  <g class="badge">
    <circle cx="39" cy="39" r="7" fill="#3E7C4F" stroke="#FBF6EC" stroke-width="1.6"/>
    <path d="M35.8 39.2l2.2 2.2 4.2-4.6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
